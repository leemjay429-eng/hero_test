<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광주비엔날레 x 여수세계섬박람회 히어로</title>
<style>
/* ===== 히어로 섹션 (embed-safe: 모든 규칙 #gjHero 하위로 스코프) ===== */
#gjHero{
  --tilt: -12.5deg;      /* 휴대폰 기울기. 반대로 눕히려면 12.5deg */
  --pop: cubic-bezier(.34,1.42,.64,1);
  --kick: 5deg;          /* 휴대폰 등장 회전 스냅. 0deg면 스케일만 튕김 */
  --ease: cubic-bezier(.65,0,.35,1);
  position:relative;
  width:100%;
  max-width:800px;       /* 표시 최대 너비 800px, 원본은 1600px */
  height:auto;
  margin:0 auto;
  overflow:hidden;       /* 뿅 등장 시 살짝 넘치는 영역 정리 */
  -webkit-tap-highlight-color:transparent;
}
#gjHero *{box-sizing:border-box;}

/* 배경: 유일한 in-flow 요소 → 히어로 높이를 결정(height:auto) */
#gjHero .gj-bg{
  display:block; width:100%; height:auto;
  position:relative; z-index:1;
}

/* 겹치는 레이어 공통 */
#gjHero .gj-lay{
  position:absolute; display:block;
  height:auto;
  transform-origin:50% 50%;
  will-change:transform,opacity;
}

/* 레이어 좌표 (1600x1820 원본 기준 % 환산 → 완전 반응형) */
#gjHero .gj-msg  { z-index:2; left: 4.3125%; top:46.6484%; width:40.6250%; }
#gjHero .gj-right{ z-index:3; left:72.5625%; top:34.2308%; width:23.5625%; }
#gjHero .gj-left { z-index:4; left: 6.7500%; top:65.4945%; width:24.5000%; }

/* 중앙 휴대폰 그룹 (프레임 + 내부 릴) */
#gjHero .gj-phone{
  position:absolute; z-index:999;
  left:30.7500%; top:34.6154%; width:43.1875%;   /* 원본 30.375% + 0.375%(= 800px 기준 3px 오른쪽) */
  transform-origin:48.4805% 48.9382%;   /* 실측한 휴대폰 실제 중심 */
  transform:rotate(var(--tilt));
  will-change:transform,opacity;
}
/* 프레임 이미지가 그룹 높이를 결정 */
#gjHero .gj-frame{
  display:block; position:relative; z-index:2;
  width:100%; height:auto; pointer-events:none;
}
/* 화면 구멍 = 클리핑 윈도우 (프레임 테두리 중앙선에 맞춤) */
#gjHero .gj-screen{
  position:absolute; z-index:1;
  left:4.9783%; top:3.1302%;
  width:86.7005%;
  aspect-ratio:599.2 / 992.2;
  overflow:hidden;
  border-radius:16.19% / 9.78%;   /* 원형 라운드 유지 */
  background:#0b3e63;
}
/* 세로 릴 트랙: 슬라이드 4장 + 1번 복제 = 5칸 */
/* 되감기 순간 파란 배경이 비치지 않도록 1번 사진을 바닥에 깔아둠 (JS가 삽입) */
#gjHero .gj-back{
  position:absolute; left:0; top:0;
  width:100%; height:100%;
  object-fit:cover; object-position:center;
}
#gjHero .gj-reel{
  position:absolute; left:0; top:0;
  width:100%; height:500%;
  display:flex; flex-direction:column;
  backface-visibility:hidden;
}
/* 릴 레이어 승격은 휴대폰 등장이 끝난 뒤에만 (등장 중 재래스터 방지) */
#gjHero.gj-live .gj-reel{ will-change:transform; }
#gjHero .gj-reel img{
  display:block; width:100%; height:20%;
  flex:0 0 20%;
  object-fit:cover; object-position:center;
}

/* ---- 초기 상태: 뿅 대상은 숨김 ---- */
#gjHero .gj-msg,
#gjHero .gj-right,
#gjHero .gj-left,
#gjHero .gj-phone{ opacity:0; }

/* ---- 뷰포트 35% 진입 시 1회 재생 ---- */
#gjHero.is-in .gj-msg  { animation:gjPop .58s .15s var(--pop) both; }
#gjHero.is-in .gj-right{ animation:gjPop .58s .38s var(--pop) both; }
#gjHero.is-in .gj-left { animation:gjPop .58s .61s var(--pop) both; }
#gjHero.is-in .gj-phone{ animation:gjPopPhone .58s 1.00s var(--pop) both; }

/* ---- 릴 넘김: 타이밍은 아래 script의 REEL 설정에서 관리 ---- */

@keyframes gjPop{
  0%  { opacity:0; transform:scale(.80); }
  55% { opacity:1; transform:scale(1.045); }
  100%{ opacity:1; transform:scale(1); }
}
@keyframes gjPopPhone{
  0%  { opacity:0; transform:rotate(calc(var(--tilt) - var(--kick))) scale(.80) translateZ(0); }
  55% { opacity:1; transform:rotate(calc(var(--tilt) + var(--kick) * .24)) scale(1.045) translateZ(0); }
  100%{ opacity:1; transform:rotate(var(--tilt)) scale(1) translateZ(0); }
}

/* 모션 최소화 선호 시: 최종 상태만 */
@media (prefers-reduced-motion: reduce){
  #gjHero .gj-msg,#gjHero .gj-right,#gjHero .gj-left,#gjHero .gj-phone{ opacity:1; }
  #gjHero.is-in .gj-msg,#gjHero.is-in .gj-right,
  #gjHero.is-in .gj-left,#gjHero.is-in .gj-phone,
  #gjHero.is-in .gj-reel{ animation:none; }
  #gjHero .gj-phone{ transform:rotate(var(--tilt)); }
}
</style>
</head>

<script>
(function(){
  var hero = document.getElementById('gjHero');
  if(!hero) return;
  var fired = false;

  /* ============================================================
     릴(사진 넘김) 타이밍 설정 — 여기 숫자만 고치면 됩니다 (단위: 초)
     ============================================================ */
  var REEL = {
    start:     1.62,   /* 휴대폰 등장 시작 후 릴이 첫 넘김을 준비할 때까지 */
    slide:     0.50,   /* 한 장 넘어가는 데 걸리는 시간 */
    hold:      1.97,   /* 각 사진 정지 시간 (숫자 하나 = 전 사진 공통,
                          [1.97,1.97,1.97,1.97] 처럼 배열로 개별 지정도 가능) */
    firstHold: 1.40    /* 맨 처음 1번 사진만 짧게. 휴대폰이 뿅 등장할 때부터
                          이미 시선에 들어오므로. 루프로 돌아온 뒤에는 hold 적용 */
  };

  /* 릴 생성: 슬라이드 장수, 전체 길이, 키프레임 위치를 모두 자동 계산 */
  function startReel(){
    var reel = hero.querySelector('.gj-reel');
    if(!reel || !reel.animate) return;                 /* 미지원 시 1번 사진 고정 */
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var cells = reel.children.length;                  /* 사진 4장 + 1번 복제본 = 5칸 */
    var n     = cells - 1;                             /* 실제로 보여줄 장수 */
    if(n < 1) return;
    var step  = 100 / cells;                           /* 한 칸이 트랙에서 차지하는 % */

    var holds = [], i;
    for(i = 0; i < n; i++){
      holds.push(REEL.hold instanceof Array ? REEL.hold[i % REEL.hold.length] : REEL.hold);
    }
    var total = REEL.slide * n;
    for(i = 0; i < n; i++) total += holds[i];

    var ease = (getComputedStyle(hero).getPropertyValue('--ease') || '').trim()
               || 'cubic-bezier(.65,0,.35,1)';

    /* 루프가 마지막 칸(1번 복제)에서 첫 칸으로 되감길 때 트랙이 한 번에 크게
       점프하는데, GPU 레이어 재래스터로 한 프레임 비면 .gj-screen의 파란
       배경이 드러난다. 되감기 시점에 보여야 할 그림은 어차피 1번이므로
       1번을 릴 바닥에 깔아 그 틈을 막는다. (이미 디코딩된 이미지 재사용) */
    if(!reel.previousElementSibling){
      var back = reel.children[0].cloneNode(false);
      back.className = 'gj-back';
      back.setAttribute('aria-hidden', 'true');
      reel.parentNode.insertBefore(back, reel);
    }

    /* 각 사진마다 [정지 시작] → [정지 끝] 두 점을 찍고, 정지 끝에서 다음 칸으로 밀어냄 */
    var frames = [], t = 0;
    for(i = 0; i < n; i++){
      var y = 'translate3d(0,' + (-(i * step)) + '%,0)';
      frames.push({ offset: t / total, transform: y, easing: 'linear' });
      t += holds[i];
      frames.push({ offset: t / total, transform: y, easing: ease });
      t += REEL.slide;
    }
    frames.push({ offset: 1, transform: 'translate3d(0,' + (-(n * step)) + '%,0)' });

    /* 1번을 짧게 보여주는 방법: 루프를 조금 앞질러서 시작.
       짧게 할 시간만큼 첫 바퀴의 앞부분을 잘라내므로, 두 번째 바퀴부터는
       1번도 다른 사진과 똑같이 hold 만큼 머뭅니다.
       firstHold가 hold보다 길면 대신 시작을 그만큼 늦춥니다. */
    var diff = REEL.firstHold - holds[0];

    reel.animate(frames, {
      duration:       total * 1000,
      delay:          (REEL.start + Math.max(diff, 0)) * 1000,
      iterationStart: Math.max(-diff, 0) / total,
      iterations:     Infinity,
      fill:           'both'
    });
  }

  /* 모든 이미지를 디코딩까지 끝낸 뒤 시작 (등장 중 디코딩으로 생기는 프레임 끊김 방지) */
  function whenDecoded(cb){
    var imgs = hero.querySelectorAll('img');
    var left = imgs.length, done = false;
    function finish(){
      if(done) return; done = true;
      requestAnimationFrame(function(){ requestAnimationFrame(cb); });
    }
    if(!left) return finish();
    function tick(){ if(--left <= 0) finish(); }
    for(var i=0;i<imgs.length;i++){
      var im = imgs[i];
      if(im.decode){ im.decode().then(tick, tick); }
      else if(im.complete){ tick(); }
      else { im.addEventListener('load', tick); im.addEventListener('error', tick); }
    }
    setTimeout(finish, 3000);   /* 안전장치 */
  }

  function play(){
    if(fired) return; fired = true;
    whenDecoded(function(){
      hero.classList.add('is-in');
      startReel();
      var phone = hero.querySelector('.gj-phone');
      if(!phone) { hero.classList.add('gj-live'); return; }
      phone.addEventListener('animationend', function(){
        hero.classList.add('gj-live');       /* 릴 레이어 승격 */
        phone.style.willChange = 'auto';     /* 다 쓴 레이어 해제 */
      }, { once:true });
    });
  }
  if(!('IntersectionObserver' in window)){ play(); return; }

  var io = new IntersectionObserver(function(entries){
    for(var i=0;i<entries.length;i++){
      var e = entries[i];
      if(!e.isIntersecting) continue;
      var visible = e.intersectionRect.height;
      var needEl  = e.boundingClientRect.height * 0.35;          // 요소의 35%
      var needVp  = (window.innerHeight || 800) * 0.35;          // 뷰포트 35% (히어로가 화면보다 클 때)
      if(visible >= needEl || visible >= needVp){
        play(); io.disconnect(); return;
      }
    }
  }, { threshold:[0, 0.1, 0.2, 0.35, 0.5, 0.75] });

  io.observe(hero);
})();
</script>
</body>
